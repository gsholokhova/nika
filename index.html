<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График Ники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFEA;--card:#FFFFFF;--ink:#18231D;--muted:#6C7A72;
  --green:#1E6B4F;--amber:#B8801F;--rule:#D7DCD6;--rule-soft:#E7EAE5;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
  font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding:14px 18px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
#sync{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto;transition:background .25s}
#sync.saving{background:var(--amber)}
#sync.offline{background:#B4453A}
#rolePill{padding:6px 14px;border:1px solid var(--rule);border-radius:999px;font-size:13px;font-weight:500;
  color:var(--muted);user-select:none;-webkit-user-select:none;transition:transform .5s ease,background .5s ease,color .5s ease}
#rolePill.boss{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#rolePill.pressing{transform:scale(.93);background:var(--rule-soft)}
.accum{margin-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.accum .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:.95}
.accum .big span{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.accum .note{font-size:12.5px;color:var(--muted);text-align:right;max-width:48%;line-height:1.3}

.weeknav{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--rule-soft)}
.weeknav .lbl{font-size:14px;font-weight:600}
.weeknav .lbl em{font-style:normal;color:var(--muted);font-weight:400}
.arrow{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);display:grid;place-items:center;font-size:17px;color:var(--muted)}
.arrow:active{background:var(--rule-soft)}
.today-btn{font-size:13px;color:var(--green);font-weight:600;padding:4px 2px}

main{flex:1;padding-bottom:96px}
.days{background:var(--card);border-bottom:1px solid var(--rule)}
.day{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 18px 13px 15px;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent;background:var(--card)}
.day:last-child{border-bottom:0}
.day:active{background:#F7F8F6}
.day.on{border-left-color:var(--green)}
.day.exc{border-left-color:var(--amber)}
.day.past{opacity:.62}
.day.today{background:#F5F8F5}
.dnum b{display:block;font-size:19px;font-weight:600}
.dnum i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
.dmid{min-width:0}
.dmid b{display:block;font-size:14.5px;font-weight:500}
.dmid i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dright{text-align:right;font-size:14.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.dright.on{color:var(--ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:5px;background:var(--amber);color:#fff;font-size:11px;font-weight:600;margin-left:6px;vertical-align:1px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:2px}
.lock{font-size:11.5px;color:var(--muted);margin-left:6px;font-weight:400}
.wsum{display:flex;justify-content:space-between;padding:12px 18px;font-size:13.5px;color:var(--muted);background:var(--paper)}
.wsum b{color:var(--ink);font-weight:600;font-size:14.5px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(237,239,234,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);padding:8px 18px calc(8px + var(--safe-b));max-width:520px;margin:0 auto;display:flex;gap:8px}
nav button{flex:1;padding:11px 0;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--muted)}
nav button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.scrim{position:fixed;inset:0;background:rgba(24,35,29,.38);opacity:0;pointer-events:none;transition:opacity .22s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.grip{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:9px auto 0}
.shead{padding:12px 18px 10px;border-bottom:1px solid var(--rule-soft);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shead h2{margin:0;font-size:19px;font-weight:600}
.shead .sub{font-size:12.5px;color:var(--muted)}
.sbody{padding:16px 18px calc(20px + var(--safe-b));overflow-y:auto}
.sect{margin-bottom:22px}
.sect:last-child{margin-bottom:0}
.sect > h3{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border:1px solid var(--rule);border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.amber[aria-pressed=true]{background:var(--amber);border-color:var(--amber)}

.hours{display:flex;align-items:center;gap:14px}
.hbtn{width:50px;height:50px;border:1px solid var(--rule);border-radius:12px;font-size:22px;font-weight:500;display:grid;place-items:center}
.hbtn:active{background:var(--rule-soft)}
.hbtn[disabled]{opacity:.35}
.hval{flex:1;text-align:center}
.hval b{display:block;font-size:31px;font-weight:700;letter-spacing:-.02em}
.hval i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.warn{margin-top:10px;font-size:12.5px;color:var(--amber);font-weight:500;text-align:center}

.plist{list-style:none;margin:0;padding:0}
.pitem{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.pitem:last-child{border-bottom:0}
.tick{width:22px;height:22px;border:1.5px solid var(--rule);border-radius:6px;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;font-size:13px;color:transparent}
.tick[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.ptext{flex:1;min-width:0;font-size:14.5px}
.pitem.done .ptext{text-decoration:line-through;color:var(--muted)}
.ptext small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;text-decoration:none}
.pdel{color:var(--muted);font-size:17px;padding:0 2px;line-height:1}
.padd{display:flex;gap:8px;margin-top:10px}
.padd input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;padding:10px 11px;background:none;font-size:14.5px}
.padd input.sm{flex:0 0 86px}
.padd button{padding:0 15px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600}
.carry{background:#FDF8EC;border:1px solid #EFDFB8;border-radius:12px;padding:11px 13px;margin-top:12px}
.carry h4{margin:0 0 5px;font-size:12.5px;font-weight:600;color:var(--amber)}
.exp{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
.exp:last-of-type{border-bottom:0}
.exp .a{font-weight:600;white-space:nowrap}
.exp small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}

textarea{width:100%;border:1px solid var(--rule);border-radius:11px;padding:11px;background:none;resize:vertical;min-height:74px;font-size:14.5px}
.meta{font-size:11.5px;color:var(--muted);margin-top:14px}
.locked{background:#F5F7F4;border-radius:11px;padding:12px 13px;font-size:13.5px;color:var(--muted)}
.datefield{display:flex;gap:9px}
.datefield label{flex:1;font-size:12.5px;color:var(--muted)}
.datefield input{display:block;width:100%;margin-top:5px;border:1px solid var(--rule);border-radius:9px;padding:9px 10px;background:none;font-size:14.5px}

.panel{background:var(--card);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;margin-bottom:18px}
.presets{display:flex;gap:7px;margin-top:11px}
.presets button{flex:1;padding:9px 0;border:1px solid var(--rule);border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.led{list-style:none;margin:14px 0 0;padding:0}
.led li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
.led li.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:12px;font-size:17px;font-weight:700}
.led .k{color:var(--muted)}
.led li.total .k{color:var(--ink)}
.paybtn{width:100%;margin-top:16px;padding:15px;border-radius:12px;background:var(--green);color:#fff;font-size:15.5px;font-weight:600}
.paybtn[disabled]{background:var(--rule);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4}
.hist{padding:0 18px}
.hist h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600}
.hitem{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.hitem .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.hitem b{font-size:15.5px}
.empty{padding:22px 18px;color:var(--muted);font-size:14px;text-align:center}
.foot{padding:20px 18px 10px;font-size:11.5px;color:var(--muted);line-height:1.45}

#boot{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;place-items:center;text-align:center;padding:30px}
#boot .m{font-size:14.5px;color:var(--muted);max-width:300px;line-height:1.5}
#boot button{margin-top:16px;padding:11px 20px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600}
#boot.hidden{display:none}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:20;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hrow">
      <div class="ttl">График <span id="sync" title="Синхронизация"></span></div>
      <div id="rolePill">Ника</div>
    </div>
    <div class="accum">
      <div class="big num" id="accum"></div>
      <div class="note" id="accumNote"></div>
    </div>
  </header>

  <main>
    <section id="viewWeek">
      <div class="weeknav">
        <button class="arrow" id="prevW" aria-label="Предыдущая неделя">‹</button>
        <div style="text-align:center">
          <div class="lbl" id="wlabel"></div>
          <button class="today-btn" id="todayBtn">Сегодня</button>
        </div>
        <button class="arrow" id="nextW" aria-label="Следующая неделя">›</button>
      </div>
      <div class="days" id="days"></div>
      <div class="wsum"><span>За неделю</span><b class="num" id="wsum"></b></div>
    </section>

    <section id="viewPay" hidden>
      <div class="panel">
        <div class="datefield">
          <label>С <input type="date" id="from"></label>
          <label>По <input type="date" id="to"></label>
        </div>
        <div class="presets">
          <button data-preset="2w">Последние 2 недели</button>
          <button data-preset="unpaid">Всё неоплаченное</button>
        </div>
        <ul class="led" id="led"></ul>
        <button class="paybtn" id="payBtn">Отметить оплаченным</button>
        <div class="hint" id="payHint"></div>
      </div>
      <div class="hist">
        <h3>История выплат</h3>
        <div id="hist"></div>
      </div>
      <div class="foot" id="foot"></div>
    </section>
  </main>

  <nav>
    <button data-tab="week" aria-pressed="true">Неделя</button>
    <button data-tab="pay" aria-pressed="false">Оплата</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="День">
  <div class="grip"></div>
  <div class="shead"><h2 id="shTitle"></h2><div class="sub" id="shSub"></div></div>
  <div class="sbody" id="shBody"></div>
</div>
<div id="toast"></div>
<div id="boot"><div><div class="m" id="bootMsg">Загружаю таблицу…</div><button id="bootRetry" hidden>Попробовать снова</button></div></div>

<script>
/* ============================================================
   1. ПОДКЛЮЧЕНИЕ К ТАБЛИЦЕ
   Вставьте адрес веб-приложения и тот же токен, что в apps-script.gs
   ============================================================ */
const API = {
  url:   'https://script.google.com/macros/s/AKfycbyWk2Rgv0j0VQDDNvah1T5Mr2Wtaep0wMJ0cD6LVQ3MkbbNFkzaB-tGSNVSm7szXnHg2A/exec',
  token: '3650408'
};

/* ============================================================
   2. КОНФИГ
   ============================================================ */
const CONFIG = {
  rateBase:1100, rateExtra:1200,
  planDays:[1,2,4], planHours:4,
  startTime:'15:00'
};

const STATUS = {
  'плановый':        {label:'Плановый',        kind:'on',  who:'boss'},
  'доп':             {label:'Доп. день',       kind:'on',  who:'boss'},
  'отменён_заранее': {label:'Отменён заранее', kind:'off', who:'boss'},
  'отменён_в_день':  {label:'Отменён в день',  kind:'exc', who:'boss'},
  'перенесён':       {label:'Перенесён',       kind:'off', who:'boss'},
  'пауза':           {label:'Пауза',           kind:'off', who:'boss'},
  'отгул':           {label:'Не смогу прийти', kind:'off', who:'all'}
};

/* ============================================================
   3. СЕТЬ И ОЧЕРЕДЬ ЗАПИСИ
   Всё, что меняется, сначала правится локально и сразу видно,
   потом уезжает в таблицу. Не уехало — лежит в очереди и повторяется.
   ============================================================ */
async function api(action, payload){
  const res = await fetch(API.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},  // простой запрос, без preflight
    body: JSON.stringify({action, token:API.token, payload}),
    redirect:'follow'
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j.data;
}

const QUEUE=[]; let flushing=false;
function push(action,payload){ QUEUE.push({action,payload}); flush(); }
async function flush(){
  if (flushing || !QUEUE.length) return;
  flushing=true; setSync('saving');
  while(QUEUE.length){
    try { await api(QUEUE[0].action, QUEUE[0].payload); QUEUE.shift(); }
    catch(e){ flushing=false; setSync('offline'); setTimeout(flush,5000); return; }
  }
  flushing=false; setSync('ok');
}
function setSync(s){
  const el=document.getElementById('sync');
  el.className = s==='ok' ? '' : s;
  el.title = s==='ok' ? 'Всё сохранено' : s==='saving' ? 'Сохраняю…' : 'Нет связи, повторю';
}

/* ============================================================
   4. ДАННЫЕ
   ============================================================ */
const DB = { days:{}, purchases:[], expenses:[], payouts:[], seq:Date.now()%1e7 };

const num = v => v===null||v===undefined||v===''?0:Number(String(v).replace(',','.'));
const bool= v => v===true||v==='true'||v==='TRUE'||v==='1';
const str = v => v===null||v===undefined||v===''?'':String(v);

function ingest(data){
  DB.days={};
  (data.days||[]).forEach(r=>{
    DB.days[r.date]={date:r.date,status:r.status||null,hours:num(r.hours),moved_to:r.moved_to||null,
      comment:str(r.comment),payout_id:r.payout_id||null,updated_by:r.updated_by||null,updated_at:r.updated_at||null};
  });
  DB.purchases=(data.purchases||[]).map(r=>({id:r.id,day:r.day,title:str(r.title),
    done:bool(r.done),done_date:r.done_date||null,created_by:r.created_by||null}));
  DB.expenses=(data.expenses||[]).map(r=>({id:r.id,day:r.day,title:str(r.title),amount:num(r.amount),by:r.by||null}));
  DB.payouts=(data.payouts||[]).map(r=>({id:r.id,from:r.from,to:r.to,total:num(r.total),paid_date:r.paid_date}))
    .sort((a,b)=>a.to<b.to?-1:1);
}

function getDay(date){
  if (DB.days[date]) return DB.days[date];
  const isPlan = CONFIG.planDays.includes(new Date(date+'T00:00:00').getDay());
  return {date,status:isPlan?'плановый':null,hours:isPlan?CONFIG.planHours:0,
    moved_to:null,comment:'',payout_id:null,updated_by:null,updated_at:null};
}
function saveDay(day){
  day.updated_by=WHO; day.updated_at=new Date().toISOString();
  DB.days[day.date]=day;
  push('saveDay',day);
}
const purchasesFor = d => DB.purchases.filter(p=>p.day===d);
const carriedTo    = d => DB.purchases.filter(p=>!p.done && p.day<d);
const expensesFor  = d => DB.expenses.filter(e=>e.day===d);
const newId = () => 'r'+(++DB.seq).toString(36);

/* ============================================================
   5. РАСЧЁТ
   ============================================================ */
function amountOf(day){
  const s=day.status;
  if(!s) return 0;
  if(s==='отменён_в_день') return CONFIG.planHours*CONFIG.rateBase;
  if(s==='отменён_заранее'||s==='перенесён'||s==='пауза'||s==='отгул') return 0;
  const h=day.hours||0;
  return Math.round(Math.min(h,CONFIG.planHours)*CONFIG.rateBase + Math.max(0,h-CONFIG.planHours)*CONFIG.rateExtra);
}
const isWorkStatus = s => s==='плановый'||s==='доп';

/* ============================================================
   6. ДАТЫ
   ============================================================ */
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const fmtShort=s=>{const d=parse(s);return d.getDate()+' '+MONS[d.getMonth()];};
const fmtLong=s=>{const d=parse(s);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];};
const fmtH=n=>Number.isInteger(n)?n:n.toFixed(1).replace('.',',');
const money=n=>Math.round(n).toLocaleString('ru-RU').replace(/\u00A0/g,' ');
const TODAY=iso(new Date());

/* ============================================================
   7. СОСТОЯНИЕ
   ============================================================ */
let WHO='Н';
const isBoss=()=>WHO==='Г';
let TAB='week', weekStart=mondayOf(TODAY), openDate=null;

/* ============================================================
   8. ШАПКА
   ============================================================ */
function renderHeader(){
  const pill=document.getElementById('rolePill');
  pill.textContent=isBoss()?'Галина':'Ника';
  pill.classList.toggle('boss',isBoss());
  const big=document.getElementById('accum'), note=document.getElementById('accumNote');
  if(TAB==='pay'){
    big.innerHTML=money(window.__payTotal||0)+'<span>дин</span>';
    note.textContent='к выплате за выбранный период';
  } else {
    let h=0,days=0;
    for(let i=0;i<7;i++){const d=getDay(addDays(weekStart,i)); if(isWorkStatus(d.status)){h+=d.hours||0;days++;}}
    big.innerHTML=fmtH(h)+'<span>ч</span>';
    note.textContent=days?`${days} ${plural(days,'день','дня','дней')} на этой неделе`:'рабочих дней нет';
  }
}
function plural(n,a,b,c){const m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c;}

/* ============================================================
   9. НЕДЕЛЯ
   ============================================================ */
function renderWeek(){
  document.getElementById('wlabel').innerHTML=
    `${fmtShort(weekStart)} — ${fmtShort(addDays(weekStart,6))} <em>· ${parse(weekStart).getFullYear()}</em>`;
  const box=document.getElementById('days'); box.innerHTML=''; let hours=0;
  for(let i=0;i<7;i++){
    const date=addDays(weekStart,i), day=getDay(date), st=day.status?STATUS[day.status]:null;
    const work=isWorkStatus(day.status); if(work) hours+=day.hours||0;
    const open=purchasesFor(date).filter(p=>!p.done).length, exp=expensesFor(date).length;
    const b=document.createElement('button');
    b.className='day '+(st?st.kind:'off')+(date<TODAY?' past':'')+(date===TODAY?' today':'');
    b.dataset.date=date;
    const dd=parse(date);
    const mid = st
      ? `<b>${st.label}${day.payout_id?'<span class="lock">оплачено</span>':''}</b>
         <i>${work?CONFIG.startTime+'–'+endFor(day.hours):(day.comment||'')}</i>`
      : `<b style="color:var(--muted);font-weight:400">Свободно</b><i>&nbsp;</i>`;
    b.innerHTML=`<span class="dnum"><b>${dd.getDate()}</b><i>${DOW[dd.getDay()]}</i></span>
      <span class="dmid">${mid}${open?`<span class="badge">${open}</span>`:''}${exp?'<span class="dot"></span>':''}</span>
      <span class="dright ${work?'on':''}">${work?fmtH(day.hours)+' ч':'—'}</span>`;
    box.appendChild(b);
  }
  document.getElementById('wsum').textContent=fmtH(hours)+' ч';
  renderHeader();
}
function endFor(hours){
  const [H,M]=CONFIG.startTime.split(':').map(Number);
  const t=H*60+M+hours*60;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.round(t%60)).padStart(2,'0');
}

/* ============================================================
   10. ДЕНЬ
   ============================================================ */
function openDay(date){
  openDate=date;
  const day=getDay(date);
  document.getElementById('shTitle').textContent=fmtLong(date);
  document.getElementById('shSub').textContent=
    day.payout_id?'В закрытой выплате':(day.status?STATUS[day.status].label:'Свободный день');
  renderSheet();
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  openDate=null; renderWeek(); renderPay();
}
function renderSheet(){
  const date=openDate, day=getDay(date), body=document.getElementById('shBody');
  const locked=!!day.payout_id, work=isWorkStatus(day.status);
  let h='';
  if(locked){
    const p=DB.payouts.find(x=>x.id===day.payout_id);
    h+=`<div class="sect"><div class="locked">День входит в выплату${p?' от '+fmtShort(p.paid_date):''} и больше не редактируется.</div></div>`;
  }
  const keys=Object.keys(STATUS).filter(k=>isBoss()||STATUS[k].who==='all'||day.status===k);
  const editable=k=>!locked&&(isBoss()||STATUS[k].who==='all');
  h+=`<div class="sect"><h3>Статус</h3><div class="chips">`;
  keys.forEach(k=>{
    h+=`<button class="chip${STATUS[k].kind==='exc'?' amber':''}" data-st="${k}" aria-pressed="${day.status===k}" ${editable(k)?'':'disabled'}>${STATUS[k].label}</button>`;
  });
  if(day.status&&(isBoss()||day.status==='отгул'))
    h+=`<button class="chip" data-st="" aria-pressed="false" ${locked?'disabled':''}>Убрать</button>`;
  h+=`</div>`;
  if(day.status==='перенесён'&&isBoss())
    h+=`<div class="datefield" style="margin-top:11px"><label>Перенесён на
        <input type="date" id="movedTo" value="${day.moved_to||''}" ${locked?'disabled':''}></label></div>`;
  h+=`</div>`;

  if(work){
    h+=`<div class="sect"><h3>Часы</h3><div class="hours">
      <button class="hbtn" data-h="-0.5" ${locked||day.hours<=0.5?'disabled':''}>−</button>
      <div class="hval"><b class="num">${fmtH(day.hours)} ч</b><i>${CONFIG.startTime}–${endFor(day.hours)}</i></div>
      <button class="hbtn" data-h="0.5" ${locked?'disabled':''}>+</button></div>
      ${day.hours<CONFIG.planHours?`<div class="warn">Меньше плановых ${CONFIG.planHours} ч</div>`:''}
      ${day.hours>CONFIG.planHours?`<div class="warn">+${fmtH(day.hours-CONFIG.planHours)} ч сверх плана</div>`:''}
    </div>`;
  }

  h+=`<div class="sect"><h3>Покупки</h3><ul class="plist">`;
  const list=purchasesFor(date);
  if(!list.length) h+=`<li class="pitem" style="border:0;color:var(--muted);font-size:14px">Пока ничего</li>`;
  list.forEach(p=>{
    h+=`<li class="pitem ${p.done?'done':''}">
      <button class="tick" data-tick="${p.id}" aria-pressed="${p.done}" ${locked?'disabled':''}>✓</button>
      <span class="ptext">${esc(p.title)}${p.done&&p.done_date?`<small>куплено ${fmtShort(p.done_date)}</small>`:''}</span>
      <button class="pdel" data-del="${p.id}" aria-label="Удалить" ${locked?'disabled':''}>×</button></li>`;
  });
  h+=`</ul>`;
  if(!locked) h+=`<div class="padd"><input id="pnew" placeholder="Что купить" enterkeyhint="done"><button id="paddBtn">Добавить</button></div>`;
  const carry=carriedTo(date);
  if(carry.length){
    h+=`<div class="carry"><h4>Осталось с прошлых дней</h4><ul class="plist">`;
    carry.forEach(p=>{
      h+=`<li class="pitem"><button class="tick" data-tick="${p.id}" aria-pressed="false">✓</button>
          <span class="ptext">${esc(p.title)}<small>с ${fmtShort(p.day)}</small></span></li>`;
    });
    h+=`</ul></div>`;
  }
  h+=`</div>`;

  h+=`<div class="sect"><h3>Дополнительные расходы</h3>`;
  const exp=expensesFor(date);
  if(!exp.length) h+=`<div style="color:var(--muted);font-size:14px;padding:2px 0 4px">Ника ничего не тратила</div>`;
  exp.forEach(e=>{
    h+=`<div class="exp"><span>${esc(e.title)}<small>внесла ${e.by==='Г'?'Галина':'Ника'}</small></span>
      <span style="display:flex;gap:8px;align-items:flex-start"><span class="a num">${money(e.amount)}</span>
      ${locked?'':`<button class="pdel" data-delexp="${e.id}" aria-label="Удалить">×</button>`}</span></div>`;
  });
  if(!locked)
    h+=`<div class="padd"><input id="enew" placeholder="На что" enterkeyhint="done">
        <input id="eamt" class="sm" type="number" inputmode="numeric" placeholder="дин">
        <button id="eaddBtn">+</button></div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:7px">Возвращается отдельной строкой в выплате</div>`;
  h+=`</div>`;

  h+=`<div class="sect"><h3>Комментарий</h3>
      <textarea id="cmt" placeholder="Что было в этот день" ${locked?'disabled':''}>${esc(day.comment)}</textarea></div>`;
  if(day.updated_by)
    h+=`<div class="meta">Изменено: ${day.updated_by==='Г'?'Галина':'Ника'}, ${when(day.updated_at)}</div>`;
  body.innerHTML=h;
}
function when(s){
  const d=new Date(s); if(isNaN(d)) return '';
  const day=iso(d), t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(day===TODAY) return 'сегодня '+t;
  if(day===addDays(TODAY,-1)) return 'вчера '+t;
  return fmtShort(day)+' '+t;
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   11. ОПЛАТА
   ============================================================ */
function periodStart(){
  const last=DB.payouts.length?DB.payouts[DB.payouts.length-1].to:null;
  return last?addDays(last,1):addDays(TODAY,-13);
}
function defaultRange(){
  const back=(parse(TODAY).getDay()-5+7)%7;
  const to=addDays(TODAY,-back), from=periodStart();
  return {from,to:to<from?from:to};
}
function renderPay(){
  const from=document.getElementById('from').value, to=document.getElementById('to').value;
  const led=document.getElementById('led');
  if(!from||!to||from>to){led.innerHTML='<li class="k">Выберите период</li>';window.__payTotal=0;renderHeader();return;}
  let planDays=0,planSum=0,extraH=0,extraSum=0,cancel=0,cancelSum=0,lockedN=0;
  for(let d=from; d<=to; d=addDays(d,1)){
    const day=DB.days[d]||getDay(d);
    if(day.payout_id){lockedN++;continue;}
    if(!day.status) continue;
    if(day.status==='отменён_в_день'){cancel++;cancelSum+=amountOf(day);continue;}
    if(isWorkStatus(day.status)){
      const hh=day.hours||0; planDays++;
      planSum+=Math.min(hh,CONFIG.planHours)*CONFIG.rateBase;
      extraH+=Math.max(0,hh-CONFIG.planHours);
      extraSum+=Math.max(0,hh-CONFIG.planHours)*CONFIG.rateExtra;
    }
  }
  let expSum=0;
  DB.expenses.forEach(e=>{ if(e.day>=from&&e.day<=to&&!(DB.days[e.day]&&DB.days[e.day].payout_id)) expSum+=e.amount||0; });
  const total=planSum+extraSum+cancelSum+expSum;
  window.__payTotal=total;
  let h=row(`Рабочих дней · ${planDays}`,planSum);
  if(extraH) h+=row(`Дополнительные часы · ${fmtH(extraH)} ч`,extraSum);
  if(cancel) h+=row(`Отменены в день · ${cancel}`,cancelSum);
  if(expSum) h+=row('Расходы Ники',expSum);
  h+=`<li class="total"><span class="k">К выплате</span><span class="num">${money(total)} дин</span></li>`;
  led.innerHTML=h;
  const btn=document.getElementById('payBtn');
  btn.disabled=!isBoss()||total===0;
  document.getElementById('payHint').textContent=
    !isBoss()?'Отмечать выплаты может только Галина.'
    :lockedN?`${lockedN} ${plural(lockedN,'день','дня','дней')} уже входят в закрытые выплаты и не учтены.`
    :'После отметки дни периода блокируются от изменений.';
  const hist=document.getElementById('hist');
  hist.innerHTML=DB.payouts.length?'':'<div class="empty">Выплат пока не было</div>';
  [...DB.payouts].reverse().forEach(p=>{
    const el=document.createElement('div'); el.className='hitem';
    el.innerHTML=`<span>${fmtShort(p.from)} — ${fmtShort(p.to)}<div class="d">отмечено ${fmtShort(p.paid_date)}</div></span><b class="num">${money(p.total)} дин</b>`;
    hist.appendChild(el);
  });
  renderHeader();
}
const row=(k,v)=>`<li><span class="k">${k}</span><span class="num">${money(v)}</span></li>`;

/* ============================================================
   12. РОЛЬ
   ============================================================ */
const pill=document.getElementById('rolePill');
let holdT=null;
pill.addEventListener('pointerdown',()=>{
  if(isBoss()){ WHO='Н'; toast('Режим Ники'); refreshAll(); return; }
  pill.classList.add('pressing');
  holdT=setTimeout(()=>{
    pill.classList.remove('pressing'); WHO='Г'; toast('Режим Галины'); refreshAll();
    if(navigator.vibrate) navigator.vibrate(12);
  },700);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  pill.addEventListener(ev,()=>{clearTimeout(holdT);pill.classList.remove('pressing');}));
pill.addEventListener('contextmenu',e=>e.preventDefault());

function refreshAll(){ renderWeek(); renderPay(); if(openDate) renderSheet(); }
let toastT=null;
function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============================================================
   13. СОБЫТИЯ
   ============================================================ */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    TAB=b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('viewWeek').hidden=TAB!=='week';
    document.getElementById('viewPay').hidden =TAB!=='pay';
    if(TAB==='pay') renderPay(); else renderHeader();
  };
});
document.getElementById('prevW').onclick=()=>{weekStart=addDays(weekStart,-7);renderWeek();};
document.getElementById('nextW').onclick=()=>{weekStart=addDays(weekStart,7);renderWeek();};
document.getElementById('todayBtn').onclick=()=>{weekStart=mondayOf(TODAY);renderWeek();};
document.getElementById('days').onclick=e=>{const b=e.target.closest('.day');if(b)openDay(b.dataset.date);};
document.getElementById('scrim').onclick=closeSheet;

let tx=0,ty=0;
const vw=document.getElementById('viewWeek');
vw.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
vw.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*2){weekStart=addDays(weekStart,dx<0?7:-7);renderWeek();}
},{passive:true});

document.getElementById('shBody').addEventListener('click',e=>{
  const day=getDay(openDate);
  const st=e.target.closest('[data-st]');
  if(st){
    const v=st.dataset.st;
    day.status=v||null;
    if(isWorkStatus(v)&&!day.hours) day.hours=CONFIG.planHours;
    saveDay(day);
    document.getElementById('shSub').textContent=day.status?STATUS[day.status].label:'Свободный день';
    renderSheet(); return;
  }
  const hb=e.target.closest('[data-h]');
  if(hb){ day.hours=Math.max(0,Math.round((day.hours+parseFloat(hb.dataset.h))*2)/2); saveDay(day); renderSheet(); return; }
  const tk=e.target.closest('[data-tick]');
  if(tk){
    const p=DB.purchases.find(x=>x.id===tk.dataset.tick);
    p.done=!p.done; p.done_date=p.done?openDate:null;
    push('savePurchase',p); renderSheet(); return;
  }
  const dl=e.target.closest('[data-del]');
  if(dl){ const id=dl.dataset.del; DB.purchases=DB.purchases.filter(x=>x.id!==id); push('deletePurchase',{id}); renderSheet(); return; }
  const de=e.target.closest('[data-delexp]');
  if(de){ const id=de.dataset.delexp; DB.expenses=DB.expenses.filter(x=>x.id!==id); push('deleteExpense',{id}); renderSheet(); return; }
  if(e.target.id==='paddBtn'){ addPurchase(); return; }
  if(e.target.id==='eaddBtn'){ addExpense(); return; }
});
document.getElementById('shBody').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='pnew'){e.preventDefault();addPurchase();}
  if(e.target.id==='enew'||e.target.id==='eamt'){e.preventDefault();addExpense();}
});
document.getElementById('shBody').addEventListener('change',e=>{
  const day=getDay(openDate);
  if(e.target.id==='cmt'){ day.comment=e.target.value; saveDay(day); }
  if(e.target.id==='movedTo'){
    day.moved_to=e.target.value; saveDay(day);
    if(e.target.value){ const t=getDay(e.target.value); t.status='доп'; if(!t.hours)t.hours=CONFIG.planHours; saveDay(t); }
    renderSheet();
  }
});
function addPurchase(){
  const i=document.getElementById('pnew'), t=i.value.trim(); if(!t) return;
  const p={id:newId(),day:openDate,title:t,done:false,done_date:null,created_by:WHO};
  DB.purchases.push(p); push('savePurchase',p);
  renderSheet(); const n=document.getElementById('pnew'); if(n) n.focus();
}
function addExpense(){
  const t=document.getElementById('enew').value.trim(), a=Number(document.getElementById('eamt').value);
  if(!t||!a){ toast('Нужны название и сумма'); return; }
  const ex={id:newId(),day:openDate,title:t,amount:a,by:WHO};
  DB.expenses.push(ex); push('saveExpense',ex);
  renderSheet(); const n=document.getElementById('enew'); if(n) n.focus();
}

document.getElementById('from').onchange=renderPay;
document.getElementById('to').onchange=renderPay;
document.querySelectorAll('.presets button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.preset==='2w'){
      const r=defaultRange();
      document.getElementById('from').value=r.from; document.getElementById('to').value=r.to;
    } else {
      const unpaid=Object.keys(DB.days).filter(d=>!DB.days[d].payout_id).sort();
      document.getElementById('from').value=unpaid[0]||periodStart();
      document.getElementById('to').value=TODAY;
    }
    renderPay();
  };
});
document.getElementById('payBtn').onclick=()=>{
  const from=document.getElementById('from').value, to=document.getElementById('to').value;
  const total=window.__payTotal||0;
  if(!confirm(`Отметить период ${fmtShort(from)} — ${fmtShort(to)} оплаченным на ${money(total)} дин?\n\nДни будут закрыты от изменений.`)) return;
  const payout={id:newId(),from,to,total,paid_date:TODAY};
  const dates=[];
  for(let d=from; d<=to; d=addDays(d,1)){
    const day=getDay(d);
    if(day.payout_id||!day.status) continue;
    day.payout_id=payout.id; day.updated_by=WHO; day.updated_at=new Date().toISOString();
    DB.days[d]=day; dates.push(d);
  }
  DB.payouts.push(payout);
  push('closePayout',{payout,days:dates});
  renderPay(); renderWeek(); toast('Выплата отмечена');
};

/* ============================================================
   14. ЗАПУСК И ФОНОВОЕ ОБНОВЛЕНИЕ
   ============================================================ */
async function boot(){
  const b=document.getElementById('boot'), msg=document.getElementById('bootMsg'), retry=document.getElementById('bootRetry');
  if(API.url.startsWith('ВСТАВЬТЕ')){
    msg.textContent='Адрес таблицы не указан. Откройте файл в редакторе и впишите адрес веб-приложения и токен в блок API вверху скрипта.';
    retry.hidden=true; return;
  }
  msg.textContent='Загружаю таблицу…'; retry.hidden=true;
  try{
    ingest(await api('load'));
    const r=defaultRange();
    document.getElementById('from').value=r.from;
    document.getElementById('to').value=r.to;
    document.getElementById('foot').textContent='Данные хранятся в Google-таблице. Обновление раз в полминуты.';
    renderWeek(); renderPay(); setSync('ok');
    b.classList.add('hidden');
  }catch(e){
    msg.textContent='Не получилось связаться с таблицей: '+e.message;
    retry.hidden=false;
  }
}
document.getElementById('bootRetry').onclick=boot;

/* тихое обновление: только когда вкладка видна, шторка закрыта и очередь пуста */
setInterval(async()=>{
  if(document.hidden||openDate||QUEUE.length||flushing) return;
  try{ ingest(await api('load')); renderWeek(); renderPay(); setSync('ok'); }catch(e){ setSync('offline'); }
},30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) flush(); });

boot();
</script>
</body>
